name: Keep the Streamlit app awake

# Streamlit Community Cloud puts apps to sleep after a period with no visitors.
# Until 1 December 2026 this opens the app in a headless browser every 6 hours
# and clicks the wake-up button if the app is asleep. After that it does nothing.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Stop after 1 December 2026
        id: window
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261201 ]; then echo "active=false" >> "$GITHUB_OUTPUT"; else echo "active=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.window.outputs.active == 'true'
        with:
          node-version: 20
      - name: Install Playwright
        if: steps.window.outputs.active == 'true'
        run: npm install playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Visit the app
        if: steps.window.outputs.active == 'true'
        run: |
          cat > visit.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto('https://subham-fdrm-vix.streamlit.app', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForTimeout(10000);
            const wake = page.getByRole('button', { name: /get this app back up/i });
            if (await wake.count()) {
              console.log('App was asleep, waking it');
              await wake.first().click();
              await page.waitForTimeout(90000);
            } else {
              console.log('App is awake');
            }
            await browser.close();
          })();
          JS
          node visit.js
